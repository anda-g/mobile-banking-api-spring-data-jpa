spring.application.name=mobile-banking-api-spring-data-jpa

# ===== CONFIG BEAN OF DATASOURCE FOR ACCESSING DATABASE POSTGRES ==== #
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/db_mobile_banking
spring.datasource.username=postgres
spring.datasource.password=post

# ===== CONFIG SPRING DATA JPA DDL (CREATE ALTER RENAME ...) ===== #
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# ===== SPRING SECURITY USER CONFIG ===== #
#spring.security.user.name=anda
#spring.security.user.password=123

# ===== SPRING SECURITY DECODER FOR OAUTH2 ===== #
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/mbapi

# ===== DECLARE THE MEDIA FILE PATH ===== #
media.server-path=D:/ISTAD/Full Stack/Spring/media-upload/
media.base-uri=http://localhost:8080/media/

# ===== UPDATE MAXIMUM FILE SIZE ===== #
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB